name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests run without the heavy google-cloud-* SDKs (they are
          # imported optionally and stubbed inside the notebook test cells).
          pip install nbdev fastcore google-auth google-auth-httplib2 google-api-python-client
          pip install -e . --no-deps
      - name: Run notebook tests (nbdev-test)
        env:
          GCPEASY_QUIET: '1'
        run: nbdev-test
