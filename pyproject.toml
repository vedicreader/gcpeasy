[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcpeasy"
dynamic = ["version"]
description = "GCP cloud provisioning for GenAI workloads with enterprise compliance (HIPAA, ISO 27001, SOC 2)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "vedicreader"}]
keywords = ["gcp", "vertexai", "genai", "llm", "hipaa", "iso27001", "cloud", "devops", "google"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastcore>=1.5.29",
    "google-auth>=2.28",
    "google-auth-httplib2",
    "google-genai>=1.0",
    "google-cloud-aiplatform>=1.50",
    "google-cloud-storage>=2.16",
    "google-cloud-firestore>=2.16",
    "cloud-sql-python-connector[pg8000]>=1.7",
    "google-cloud-redis>=2.15",
    "google-cloud-compute>=1.16",
    "google-cloud-container>=2.43",
    "google-cloud-artifact-registry>=1.11",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-run>=0.10",
    "google-cloud-build>=3.20",
    "google-cloud-dns>=0.35",
    "google-cloud-access-context-manager>=0.3",
]

[project.urls]
Repository = "https://github.com/vedicreader/gcpeasy"
Documentation = "https://vedicreader.github.io/gcpeasy/"

[project.scripts]
gcpeasy = "gcpeasy.cli:main"

[project.entry-points.nbdev]
gcpeasy = "gcpeasy._modidx:d"

[tool.hatch.version]
path = "gcpeasy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gcpeasy"]

[tool.nbdev]

[dependency-groups]
dev = ["nbdev>=3.0.12"]
